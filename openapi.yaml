components:
  schemas:
    # ===== Top =====
    Top:
      type: object
      description: トップページ
      properties:
        shopMessage:
          type: string
          description: ショップメッセージ

    # ===== Catalog Schemas =====
    Product:
      type: object
      description: 商品
      properties:
        productName:
          type: string
          description: 商品名
        descriptionList:
          type: string
          description: 一覧用説明文
        descriptionDetail:
          type: string
          description: 詳細説明文
        searchWord:
          type: string
          description: 検索ワード
        freeArea:
          type: string
          description: フリーエリア（HTML入力可能）
        productStatus:
          type: integer
          description: 商品ステータス（1=公開, 2=非公開, 3=廃止）
        createDate:
          type: string
          format: date-time
          description: 作成日時
        updateDate:
          type: string
          format: date-time
          description: 更新日時
        productClasses:
          type: array
          description: 商品規格一覧
          items:
            $ref: "#/components/schemas/ProductClass"
        productImages:
          type: array
          description: 商品画像一覧
          items:
            $ref: "#/components/schemas/ProductImage"
        productCategories:
          type: array
          description: 商品カテゴリ一覧
          items:
            $ref: "#/components/schemas/ProductCategory"
        productTags:
          type: array
          description: 商品タグ一覧
          items:
            $ref: "#/components/schemas/ProductTag"

    ProductClass:
      type: object
      description: 商品規格
      properties:
        productCode:
          type: string
          description: 商品コード（SKU/品番）
        stock:
          type: integer
          description: 在庫数
        stockUnlimited:
          type: boolean
          description: 在庫無制限フラグ
        saleLimit:
          type: integer
          description: 購入制限数
