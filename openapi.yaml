openapi: 3.1.0
info:
  title: EC-CUBE 4.3 フロントAPI
  version: 4.3.0
  description: >
    EC-CUBE 4.3 顧客向けフロントエンドAPI。
    Symfony 6.4 ベースの日本語ECオープンプラットフォームのフロント操作を定義する。
    本仕様は ALPS アプリケーションプロファイル (alps.json) から生成された。
  contact:
    name: EC-CUBE
    url: https://www.ec-cube.net
  license:
    name: GPL-2.0-only
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html

servers:
  - url: https://example.com
    description: EC-CUBE フロント

tags:
  - name: top
    description: トップページ
  - name: catalog
    description: 商品カタログ（商品一覧・詳細・カテゴリ）
  - name: cart
    description: カート操作
  - name: checkout
    description: 購入手続き（注文確定まで）
  - name: account
    description: 会員アカウント（登録・ログイン・マイページ）
  - name: favorite
    description: お気に入り商品
  - name: contact
    description: お問い合わせ
  - name: help
    description: ヘルプ・利用規約・特定商取引法

paths:
  # ===== Top =====
  /:
    get:
      operationId: goTop
      tags: [top]
      summary: トップページを見る
      description: ショップのトップページ。ニュース一覧、新着商品、カテゴリナビゲーション等を表示
      responses:
        "200":
          description: トップページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Catalog =====
  /products:
    get:
      operationId: goProductList
      tags: [catalog]
      summary: 商品一覧を見る
      description: 商品一覧ページ。検索条件やカテゴリで絞り込み可能
      parameters:
        - name: categoryId
          in: query
          description: カテゴリIDで絞り込み
          schema:
            type: integer
        - name: name
          in: query
          description: 商品名で検索
          schema:
            type: string
        - name: pageno
          in: query
          description: ページ番号
          schema:
            type: integer
        - name: disp_number
          in: query
          description: 1ページあたりの表示件数
          schema:
            type: integer
        - name: orderby
          in: query
          description: ソート順
          schema:
            type: integer
      responses:
        "200":
          description: 商品一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{productId}:
    get:
      operationId: goProduct
      tags: [catalog]
      summary: 商品詳細を見る
      description: 商品詳細ページ。規格・画像・カテゴリ・タグ情報を含む
      parameters:
        - name: productId
          in: path
          required: true
          description: 商品ID
          schema:
            type: integer
      responses:
        "200":
          description: 商品詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: 商品が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories:
    get:
      operationId: goCategoryList
      tags: [catalog]
      summary: カテゴリ一覧を見る
      description: カテゴリ一覧。階層構造を持つカテゴリツリーを返す
      responses:
        "200":
          description: カテゴリ一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{categoryId}:
    get:
      operationId: goCategory
      tags: [catalog]
      summary: カテゴリ詳細を見る
      description: 指定カテゴリの詳細情報
      parameters:
        - name: categoryId
          in: path
          required: true
          description: カテゴリID
          schema:
            type: integer
      responses:
        "200":
          description: カテゴリ詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: カテゴリが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Cart =====
  /cart:
    get:
      operationId: goCart
      tags: [cart]
      summary: カートを見る
      description: カート内容の表示。販売種別ごとに分離されたカートを返す
      responses:
        "200":
          description: カート情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cart/items:
    post:
      operationId: doAddCartItem
      tags: [cart]
      summary: カートに追加する
      description: 在庫・販売制限・配送設定をチェックし、制限超過時は数量を自動調整
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productCode
                - quantity
              properties:
                productCode:
                  type: string
                  description: 商品コード（SKU/品番）
                quantity:
                  type: integer
                  description: 数量
      responses:
        "201":
          description: カートに追加された
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cart/items/{productCode}:
    put:
      operationId: doUpdateCartItemQuantity
      tags: [cart]
      summary: カート数量を変更する
      description: カート内の指定商品の数量を更新
      parameters:
        - name: productCode
          in: path
          required: true
          description: 商品コード
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  description: 変更後の数量
      responses:
        "200":
          description: カート更新後
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: カート内に該当商品がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: doRemoveCartItem
      tags: [cart]
      summary: カートから削除する
      description: カート内の指定商品を削除
      parameters:
        - name: productCode
          in: path
          required: true
          description: 商品コード
          schema:
            type: string
      responses:
        "200":
          description: カート削除後
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: カート内に該当商品がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Checkout =====
  /shopping:
    get:
      operationId: goShopping
      tags: [checkout]
      summary: 注文手続きへ進む
      description: カートから注文手続きへ遷移。未ログイン時はShoppingLoginへリダイレクト
      responses:
        "200":
          description: 注文手続き画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shopping"
        "302":
          description: 未ログインのためログイン画面へリダイレクト
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/login:
    get:
      operationId: goShoppingLogin
      tags: [checkout]
      summary: 購入ログインを見る
      description: 購入手続き時のログイン画面。会員ログインまたはゲスト購入を選択
      responses:
        "200":
          description: 購入ログイン画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingLogin"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/nonmember:
    get:
      operationId: goShoppingNonMember
      tags: [checkout]
      summary: 非会員購入情報入力へ進む
      description: 非会員（ゲスト）が注文者情報を入力する画面
      responses:
        "200":
          description: 非会員購入情報入力画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingNonMember"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: doSubmitNonMember
      tags: [checkout]
      summary: 非会員情報を送信する
      description: ゲスト購入用の注文者情報を送信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name01
                - name02
                - email
                - postalCode
                - pref
                - addr01
                - addr02
                - phoneNumber
              properties:
                name01:
                  type: string
                  description: 姓
                name02:
                  type: string
                  description: 名
                kana01:
                  type: string
                  description: セイ
                kana02:
                  type: string
                  description: メイ
                companyName:
                  type: string
                  description: 会社名
                email:
                  type: string
                  format: email
                  description: メールアドレス
                phoneNumber:
                  type: string
                  description: 電話番号
                postalCode:
                  type: string
                  description: 郵便番号
                pref:
                  type: integer
                  description: 都道府県（1〜47）
                addr01:
                  type: string
                  description: 市区町村
                addr02:
                  type: string
                  description: 番地・建物名
      responses:
        "200":
          description: 注文手続き画面へ遷移
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shopping"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/shipping:
    get:
      operationId: goShoppingShipping
      tags: [checkout]
      summary: お届け先を選択する画面を見る
      description: 会員の登録済みお届け先から配送先を選択する画面
      responses:
        "200":
          description: お届け先選択画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingShipping"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: doSelectShippingAddress
      tags: [checkout]
      summary: お届け先を選択する
      description: 登録済みのお届け先を選択して配送先に設定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerAddressId:
                  type: integer
                  description: 配送先住所ID
      responses:
        "200":
          description: 注文手続き画面へ遷移
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shopping"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/shipping/edit:
    get:
      operationId: goShoppingShippingEdit
      tags: [checkout]
      summary: お届け先変更画面を見る
      description: 新しいお届け先を入力する、または非会員のお届け先を編集する画面
      responses:
        "200":
          description: お届け先変更画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingShippingEdit"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: doUpdateShippingAddress
      tags: [checkout]
      summary: お届け先を更新する
      description: 新しいお届け先の登録または既存お届け先の更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name01
                - name02
                - postalCode
                - pref
                - addr01
                - addr02
                - phoneNumber
              properties:
                name01:
                  type: string
                  description: 姓
                name02:
                  type: string
                  description: 名
                kana01:
                  type: string
                  description: セイ
                kana02:
                  type: string
                  description: メイ
                companyName:
                  type: string
                  description: 会社名
                postalCode:
                  type: string
                  description: 郵便番号
                pref:
                  type: integer
                  description: 都道府県（1〜47）
                addr01:
                  type: string
                  description: 市区町村
                addr02:
                  type: string
                  description: 番地・建物名
                phoneNumber:
                  type: string
                  description: 電話番号
      responses:
        "200":
          description: 注文手続き画面へ遷移
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shopping"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/shipping/multiple:
    get:
      operationId: goShoppingShippingMultiple
      tags: [checkout]
      summary: 複数配送先設定画面を見る
      description: 複数のお届け先に商品を振り分ける画面
      responses:
        "200":
          description: 複数配送先設定画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shopping"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/confirm:
    post:
      operationId: doConfirmOrder
      tags: [checkout]
      summary: 注文内容を確認する
      description: PaymentMethod::verifyによる決済検証を実行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod:
                  type: string
                  description: 支払方法
                message:
                  type: string
                  description: 注文メッセージ
                point:
                  type: integer
                  description: 使用ポイント
                deliveryTime:
                  type: string
                  description: 配送時間帯
                deliveryDate:
                  type: string
                  format: date
                  description: 配送希望日
      responses:
        "200":
          description: 注文確認画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingConfirm"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/checkout:
    post:
      operationId: doCheckout
      tags: [checkout]
      summary: 注文を確定する
      description: >
        税計算、送料計算、在庫引当、ポイント減算を実行。
        決済処理後に注文確認メールを送信しカートをクリア
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod:
                  type: string
                  description: 支払方法
      responses:
        "200":
          description: 注文完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingComplete"
        "400":
          description: バリデーションエラー（在庫不足等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shopping/error:
    get:
      operationId: goShoppingError
      tags: [checkout]
      summary: 購入エラー画面を表示する
      description: 在庫不足、決済失敗、セッション切れなどのエラー発生時にリダイレクトされる
      responses:
        "200":
          description: 購入エラー画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingError"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== Account =====
  /login:
    get:
      operationId: goLogin
      tags: [account]
      summary: ログイン画面を見る
      description: 顧客用ログイン画面
      responses:
        "200":
          description: ログイン画面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Login"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: doLogin
      tags: [account]
      summary: ログインする
      description: メールアドレスとパスワードで認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: メールアドレス
                password:
                  type: string
                  format: password
                  description: パスワード
      responses:
        "200":
          description: ログイン成功、マイページへ遷移
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mypage"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logout:
    delete:
      operationId: doLogout
      tags: [account]
      summary: ログアウトする
      description: セッションを破棄してログアウト
      responses:
        "200":
          description: ログアウト成功、トップページへ遷移
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /entry:
    get:
      operationId: goCustomerRegistration
      tags: [account]
      summary: 会員登録フォームを見る
      description: 会員登録フォーム画面
      responses:
        "200":
          description: 会員登録フォーム
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRegistration"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: doRegisterCustomer
      tags: [account]
      summary: 会員登録する
      description: >
        会員メール認証オプション有効時は仮会員として登録し認証メールを送信。
        無効時は即座に本会員
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name01
                - name02
                - email
                - password
              properties:
                name01:
                  type: string
                  description: 姓
                name02:
                  type: string
                  description: 名
                kana01:
                  type: string
                  description: セイ
                kana02:
                  type: string
                  description: メイ
                companyName:
                  type: string
                  description: 会社名
                email:
                  type: string
                  format: email
                  description: メールアドレス
                phoneNumber:
                  type: string
                  description: 電話番号
                postalCode:
                  type: string
                  description: 郵便番号
                pref:
                  type: integer
                  description: 都道府県（1〜47）
                addr01:
                  type: string
                  description: 市区町村
                addr02:
                  type: string
                  description: 番地・建物名
                password:
                  type: string
                  format: password
                  description: パスワード
                birth:
                  type: string
                  format: date
                  description: 生年月日
                sex:
                  type: integer
                  description: 性別（1=男性, 2=女性, 3=その他, 4=回答しない）
                job:
                  type: integer
                  description: 職業（1〜18）
      responses:
        "201":
          description: 会員登録完了
          content:
            application/json:
              schema:
