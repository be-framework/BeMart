server {
  listen 8080;
  server_name localhost;
  root "{{PROJECT_DIR}}/public";
  index index.php index.html index.htm;

  access_log "{{MALT_DIR}}/logs/nginx_8080_access.log";
  error_log "{{MALT_DIR}}/logs/nginx_8080_error.log";

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ ^/assets/(css/customize\.css|js/customize\.js)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location ~ \.php$ {
    include "{{HOMEBREW_PREFIX}}/etc/nginx/fastcgi_params";
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param APP_CONTEXT html-test-hal-api-app;
  }
}
