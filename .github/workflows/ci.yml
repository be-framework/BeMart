name: CI

on:
  push:
    branches:
      - 1.x
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: 'mysql://dbuser:secret@127.0.0.1:3306/eccubedb_test?charset=utf8mb4&serverVersion=8.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Prepare database
        run: |
          MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -uroot <<'SQL'
          CREATE USER IF NOT EXISTS 'dbuser'@'%' IDENTIFIED BY 'secret';
          GRANT ALL PRIVILEGES ON *.* TO 'dbuser'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL
          sql/setup-db.sh "$DATABASE_URL"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Psalm
        run: composer psalm

      - name: PHPUnit
        run: composer test
