# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"
reviews:
  profile: "chill"
  path_filters:
    - "!docs/api/**"
    - "!docs/web-e2e/results/**"
    - "!docs/web-e2e/screenshots/**"
    - "!docs/web-e2e/202606*-report.md"
    - "!docs/web-e2e/20260611-*.md"
    - "!var/json_schema/**"
    - "!var/json_validate/**"
    - "!var/sql/**"
    - "!**/*.html"
    # license-cleanup PR is 466 files; CodeRabbit caps review at 150 and skipped.
    # `!**/*.html` above does not match the 138 `.html.twig` clean-room reskins, and
    # the 105 mechanical `*HtmlRenderTest` add no review value. Excluding both keeps
    # the reviewable set ~69 files (the PHP/SQL/Form surface). Relax post-merge if
    # template/escaping review is wanted on future PRs.
    - "!var/templates/**"
    - "!tests/Resource/**"
    - "!composer.lock"
