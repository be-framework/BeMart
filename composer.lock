                    "php -dextension=pcov.so -d pcov.enabled=1 ./vendor/bin/phpunit --coverage-text --coverage-html=build/coverage  --coverage-clover=coverage.xml"
                ],
                "cs": [
                    "./vendor/bin/phpcs --standard=./phpcs.xml src tests"
                ],
                "cs-fix": [
                    "./vendor/bin/phpcbf src tests"
                ],
                "clean": [
                    "./vendor/bin/phpstan clear-result-cache",
                    "./vendor/bin/psalm --clear-cache",
                    "rm -rf tests/tmp/*.php"
                ],
                "sa": [
                    "./vendor/bin/phpstan analyse -c phpstan.neon",
                    "psalm --show-info=true"
                ],
                "metrics": [
                    "./vendor/bin/phpmetrics --report-html=build/metrics --exclude=Exception --log-junit=build/junit.xml --junit=build/junit.xml src"
                ],
                "phpmd": [
                    "./vendor/bin/phpmd src text ./phpmd.xml"
                ],
                "build": [
                    "@cs",
                    "@sa",
                    "@pcov",
                    "@metrics"
                ]
