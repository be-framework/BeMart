<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/bemart-favicon.png' | relative_url }}">
  <style>
    :root {
      color-scheme: light;
      --text: #1f2933;
      --muted: #52616b;
      --line: #d9e2ec;
      --link: #005ea8;
      --background: #ffffff;
      --section: #f7f9fb;
      --code: #f3f6f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
      padding-bottom: 24px;
    }

    .projectName {
      display: block;
      max-width: min(520px, 100%);
      height: auto;
      margin-bottom: 20px;
    }

    .pageTitle {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.3;
      letter-spacing: 0;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 18px;
    }

    h2 {
      border-top: 1px solid var(--line);
      font-size: 20px;
      margin: 32px 0 12px;
      padding-top: 24px;
    }

    h3 {
      font-size: 18px;
      margin: 24px 0 10px;
    }

    p {
      margin: 0 0 14px;
    }

    a {
      color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    ul,
    ol {
      padding-left: 1.4rem;
    }

    li {
      margin: 0.2rem 0;
    }

    blockquote {
      border-left: 4px solid var(--line);
      color: var(--muted);
      margin: 20px 0;
      padding: 4px 0 4px 18px;
    }

    code {
      background: var(--code);
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
      padding: 0.1em 0.28em;
    }

    pre {
      background: var(--code);
      border: 1px solid var(--line);
      overflow-x: auto;
      padding: 14px 16px;
    }

    pre code {
      background: transparent;
      border-radius: 0;
      padding: 0;
    }

    table {
      border-collapse: collapse;
      display: block;
      margin: 20px 0;
      overflow-x: auto;
      width: 100%;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--section);
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      margin-top: 40px;
      padding-top: 18px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 24px, 880px);
        padding-top: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="{{ '/' | relative_url }}" aria-label="BeMart Documentation">
        <img class="projectName" src="{{ '/assets/bemart-title.png' | relative_url }}" alt="BeMart">
      </a>
      <h1 class="pageTitle">{{ page.title | default: site.title | escape }}</h1>
      <p class="breadcrumb"><a href="{{ '/' | relative_url }}">Documentation</a></p>
    </header>

    {{ content }}

    <footer>
      {{ site.description | escape }}
    </footer>
  </main>
</body>
</html>
