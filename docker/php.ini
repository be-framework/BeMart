; Production INI for the BeMart demo image.
;
; The php:8.4-cli base image activates neither php.ini-development nor
; php.ini-production, so without this file the compiled defaults apply and
; diagnostics are written into the HTTP response body.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
expose_php = Off

memory_limit = 512M
post_max_size = 12M
upload_max_filesize = 8M

; The CSV importers accept a 5,000,000-character body; keep the transport
; limits above that and the row-level guards in the resources.
max_input_vars = 2000

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
